# Render.com için build komutu
# Puppeteer için gerekli sistem bağımlılıkları otomatik yüklenir

services:
  - type: web
    name: seller-scraper-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: false
